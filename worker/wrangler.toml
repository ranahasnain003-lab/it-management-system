# PSBA IT Inventory - AI Assistant backend, on Cloudflare Workers.
#
# Everything here is configuration, not secrets. The Gemini API key is set
# separately and never appears in this file or in the repository:
#
#   npx wrangler secret put GEMINI_API_KEY
#
# The Workers Free plan covers this service: 100,000 requests a day, and
# SQLite-backed Durable Objects for the per-account request counter. No
# billing account and no card are involved.

name = "psba-inventory-assistant"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Not secrets: the project id is in the app already, and the project number is
# public. They are here so token verification is pinned to THIS Firebase
# project and a token minted for any other project is refused.
[vars]
FIREBASE_PROJECT_ID = "it-inventory-8e690"
FIREBASE_PROJECT_NUMBER = "315288299970"

# Which Gemini model answers. Any free Flash model can be named here.
#
# READ THIS BEFORE CHANGING IT. The free tier's real constraint is a daily
# request allowance counted PER MODEL, not per key:
#
#   quotaId: GenerateRequestsPerDayPerProjectPerModel-FreeTier
#
# Measured 2026-09-27: gemini-3.6-flash and gemini-3.8-flash both allowed 20
# requests per DAY. Twenty questions is not an assistant, and it fails with
# HTTP 429, which reads as an outage rather than as a limit. The Lite model
# served 26+ in one run without refusing, so it is the only free option with
# usable headroom. Check your own numbers at https://ai.dev/rate-limit.
#
# The trade-off, stated plainly: on a question the app's own engine does not
# recognise, Lite is weaker at multi-record reasoning - it missed the working
# printers at Head Office and reported only the damaged ones. Given the same
# question WITH the app's computed answer attached, which is what the app
# sends whenever its engine understands the question, Lite answered correctly.
#
# To trade volume back for accuracy, set "gemini-3.8-flash" and live with 20
# requests a day. A paid tier removes the cap entirely.
AI_MODEL = "gemini-3.5-flash-lite"

# Set to "false" ONLY while the Android build is side-loaded as an APK rather
# than installed from Google Play: the Play Integrity provider issues App
# Check tokens only for Play-distributed builds, so enforcement would reject
# every call. With it false the Worker still requires a signed-in,
# email-verified account and still applies the per-account daily cap.
AI_REQUIRE_APP_CHECK = "true"

# One counter per account. A Durable Object handles its requests one at a
# time, which is what makes the read-decide-write atomic without a database
# transaction - the guarantee the Firestore version used to get from
# runTransaction.
[[durable_objects.bindings]]
name = "USAGE"
class_name = "UsageCounter"

# SQLite-backed classes are the ones included on the Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageCounter"]

[observability]
enabled = true
