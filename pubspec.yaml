name: it_management_system
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^2.30.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  # Proves calls to the AI Assistant backend come from a real install of this
  # app, so a stolen ID token alone cannot spend the Gemini allowance.
  firebase_app_check: ^0.2.2

  provider: ^6.1.2
  fl_chart: ^1.2.0
  go_router: ^17.4.0
  intl: ^0.19.0
  shared_preferences: ^2.5.5

  # The Local AI server's API key is a real credential: it grants use of the
  # model to whoever holds it. shared_preferences keeps values in plain text on
  # disk, so the key goes here instead - Android Keystore / EncryptedSharedPrefs
  # on Android, the Keychain on iOS/macOS.
  flutter_secure_storage: ^9.2.4

  # Derives the opaque per-user conversation scope sent to the Local AI server.
  # Hashing means the server can keep one signed-in account's chats away from
  # another's without ever learning a Firebase uid.
  crypto: ^3.0.3

  file_picker: ^8.0.7
  excel: ^4.0.6
  csv: ^6.0.0

  # Web build: path-based URLs and browser file downloads.
  flutter_web_plugins:
    sdk: flutter
  web: ^0.5.1
  cloud_functions: ^4.7.6

  # Plain HTTPS for the assistant backend, which is a Cloudflare Worker
  # rather than a Cloud Function (Cloud Functions need the Blaze plan).
  http: ^1.2.0

  # Over-the-air updates. The app is installed as an APK rather than from
  # Play, so it has to notice new builds itself:
  #   package_info_plus - the versionCode of the build that is running, which
  #                       is what a published release is compared against.
  #   path_provider     - the app's own cache directory to download into, so
  #                       no storage permission is needed.
  #   open_filex        - hands the downloaded APK to Android's package
  #                       installer, which asks the person to confirm. The app
  #                       never installs anything itself.
  package_info_plus: ^8.1.1
  path_provider: ^2.1.4
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Tests: in-memory Firestore for service/inventory unit tests, and
  # on-device integration tests against the Firebase Local Emulator Suite.
  fake_cloud_firestore: 2.5.0
  mock_exceptions: 0.8.2
  # Lets the import test serve a prepared file in place of the OS file dialog.
  plugin_platform_interface: 2.1.8
  integration_test:
    sdk: flutter
  firebase_auth_mocks: ^0.13.0

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.20

flutter:
  uses-material-design: true

  assets:
    - assets/branding/