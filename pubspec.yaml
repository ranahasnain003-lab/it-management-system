name: it_management_system
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^2.30.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0

  provider: ^6.1.2
  fl_chart: ^1.2.0
  go_router: ^17.4.0
  intl: ^0.19.0
  shared_preferences: ^2.5.5

  file_picker: ^8.0.7
  excel: ^4.0.6
  csv: ^6.0.0

  # Web build: path-based URLs and browser file downloads.
  flutter_web_plugins:
    sdk: flutter
  web: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Tests: in-memory Firestore for service/inventory unit tests, and
  # on-device integration tests against the Firebase Local Emulator Suite.
  fake_cloud_firestore: 2.5.0
  mock_exceptions: 0.8.2
  integration_test:
    sdk: flutter

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.20

flutter:
  uses-material-design: true