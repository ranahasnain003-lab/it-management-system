# Codemagic CI configuration for the iOS build of PSBA IT Inventory.
#
# Apple's compiler and code-signing tools only run on macOS, and this project
# is developed entirely on Windows. Codemagic supplies the Mac. Nothing here
# affects the Android, Web or Firebase builds.
#
# This file deliberately defines exactly ONE workflow. Codemagic validates the
# whole file when it loads it, and a workflow referring to something the
# account does not have - an App Store Connect integration, a signing
# certificate, a provisioning profile - makes the entire configuration
# invalid. When that happens NO workflow is offered, not just the broken one.
# So the signed TestFlight workflow stays commented out until the Apple
# credentials actually exist. Uncommenting it before then will stop
# ios-unsigned-verify appearing in Codemagic.
#
# Codemagic builds from the Git repository, not from the Windows working
# directory. Anything not committed and pushed is absent from the build.

workflows:
  # ===========================================================================
  # Compile check on macOS - requires NO Apple Developer account, no
  # certificate and no provisioning profile. This is the one to run first.
  # ===========================================================================
  ios-unsigned-verify:
    name: iOS compile check (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Flutter version in use
        script: flutter --version

      - name: Get packages
        script: flutter pub get

      - name: Analyzer
        script: flutter analyze

      - name: Tests
        script: flutter test

      - name: Report whether the Firebase iOS plist is present
        script: |
          # Not fatal. This app calls Firebase.initializeApp(options: ...) with
          # values compiled in from lib/firebase_options.dart, so it runs on
          # iOS without GoogleService-Info.plist. The plist is only needed if
          # Analytics, Crashlytics or App Check on iOS are turned on later.
          if [ -f ios/Runner/GoogleService-Info.plist ]; then
            echo "GoogleService-Info.plist: present"
          else
            echo "GoogleService-Info.plist: absent - fine for this build."
          fi

      - name: Build unsigned iOS app
        # --no-codesign is what makes this runnable with no Apple account.
        # It also runs pod install on the way.
        script: flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/*.app

